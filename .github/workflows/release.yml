name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64, s390x]
        include:
          - goarch: amd64
            arch_name: 64
          - goarch: arm64
            arch_name: arm64-v8a
          - goarch: s390x
            arch_name: s390x

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOEXPERIMENT: jsonv2
        run: |
          go build -tags "sing xray" -ldflags="-s -w" -o V2bX .
          chmod +x V2bX

      - name: Package
        run: |
          mkdir -p release
          zip -j release/V2bX-linux-${{ matrix.arch_name }}.zip V2bX

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2bX-linux-${{ matrix.arch_name }}
          path: release/V2bX-linux-${{ matrix.arch_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -la release/

      - name: Get tag name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: V2bX ${{ steps.get_tag.outputs.tag }}
          body: |
            ## V2bX ${{ steps.get_tag.outputs.tag }}
            
            ### 修复内容
            - 修复 sing 内核断流问题 - 限速逻辑优化
            - 为 anytls 协议禁用限速包装
            
            ### 下载
            - `V2bX-linux-64.zip` - x86_64 架构
            - `V2bX-linux-arm64-v8a.zip` - ARM64 架构
            - `V2bX-linux-s390x.zip` - s390x 架构
            
            ### 一键安装
            ```bash
            wget -N https://raw.githubusercontent.com/awkys/V2bX/dev_new/install.sh && bash install.sh
            ```
          files: release/*
          draft: false
          prerelease: false
